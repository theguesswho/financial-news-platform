version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: financeiq-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: financenews2026
      POSTGRES_DB: financialnewsplatform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: financeiq-backend
    environment:
      DB_HOST_IP: postgres
      DB_PASSWORD: financenews2026
      DB_USER: postgres
      DB_NAME: financialnewsplatform
      JWT_SECRET_KEY: your-secret-key-change-in-production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    command: python start_api.py --host 0.0.0.0 --no-reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: financeiq-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3001:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:

networks:
  default:
    name: financeiq-network
